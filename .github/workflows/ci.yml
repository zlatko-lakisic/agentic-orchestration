name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentic-orchestration-tool/requirements.txt
            agentic-orchestration-tool/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest (unit tier)
        run: pytest

  agent-harness-static:
    name: Agent harness L0 (static catalog)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentic-orchestration-tool/requirements.txt
            agentic-orchestration-tool/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: L0 static harness (full catalog)
        run: python main.py --harness-batch --harness-tier static --harness-json

  agent-harness-connectivity:
    name: Agent harness L1 (connectivity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentic-orchestration-tool/requirements.txt
            agentic-orchestration-tool/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check connectivity prerequisites
        id: connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping credentialed connectivity checks for Dependabot"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; skipping credentialed connectivity checks"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: L1 connectivity (credentialed cloud subset)
        if: steps.connectivity.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTIC_HARNESS_SKIP_SELFCONTAINED_INIT: "1"
        run: python main.py --harness-batch --harness-tier connectivity --harness-filter "gpt_*" --harness-json

      - name: Agent harness unit tests
        run: pytest -m "agent_harness or user_harness" -o addopts="-ra"

  python-smoke-import:
    name: Import smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps only
        run: pip install -r requirements.txt

      - name: Verify orchestration modules import
        run: |
          python -c "from orchestration import config_loader, runner, dynamic_planner"
          python -c "import main"

  docker-worker-smoke:
    name: Docker worker smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image and run smoke test
        run: bash scripts/docker-worker-smoke.sh

  kind-kubernetes-e2e:
    name: kind Kubernetes e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentic-orchestration-tool/requirements.txt
            agentic-orchestration-tool/requirements-dev.txt

      - name: kind cluster + stub worker e2e
        run: bash scripts/k8s-kind-e2e.sh

  web-unit:
    name: Web server unit tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-orchestration-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentic-orchestration-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server entry
        run: node --check server.mjs

      - name: Run node:test suite
        run: npm test

  site-build:
    name: Landing site lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  plant-knowledge-mcp:
    name: plant-knowledge-mcp unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extras/plant-knowledge-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extras/plant-knowledge-mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  admin-build:
    name: Admin console lint + test + build
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NG_CLI_ANALYTICS: "false"
    defaults:
      run:
        working-directory: agentic-orchestration-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agentic-orchestration-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      # The coordinator image and the edge hostPath deploy ship the bundle that
      # is committed under agentic-orchestration-web/public/admin. The build is
      # byte-reproducible, so any difference means the bundle is stale.
      - name: Committed bundle matches source
        run: |
          if [ -n "$(git status --porcelain -- ../agentic-orchestration-web/public/admin)" ]; then
            git status --short -- ../agentic-orchestration-web/public/admin | head -20
            echo "::error::agentic-orchestration-web/public/admin is stale. Run 'npm run build' in agentic-orchestration-admin and commit the result."
            exit 1
          fi
