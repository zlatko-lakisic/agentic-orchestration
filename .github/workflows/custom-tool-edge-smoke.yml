name: Custom tool edge smoke

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-smoke-note:
    name: Edge smoke (manual SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document edge smoke entrypoint
        run: |
          echo "Run on Ada/Jetson after deploy:"
          echo "  bash agentic-orchestration-tool/scripts/edge-custom-tool-smoke.sh"
          echo "Defaults: AO_WS_URL=https://127.0.0.1:8765 (HTTPS on edge)"
          echo "Optional: AO_INSECURE=1, REACH_REPO=/path/to/reach,"
          echo "  AGENTIC_CUSTOM_TOOL_SANDBOX=1 (sandbox phase; default tunnel-only)"
          test -f agentic-orchestration-tool/scripts/edge-custom-tool-smoke.sh
