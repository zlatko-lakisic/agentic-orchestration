# Opt-in live LLM smoke tests — not required for PR merges.
# Add repository secret: OPENAI_API_KEY
# Run manually: Actions → Live LLM → Run workflow

name: Live LLM

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC (optional weekly smoke)
    - cron: "0 6 * * 1"

concurrency:
  group: live-llm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-llm-smoke:
    name: Live LLM smoke
    if: github.repository == 'zlatko-lakisic/agentic-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agentic-orchestration-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentic-orchestration-tool/requirements.txt
            agentic-orchestration-tool/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-timeout

      - name: Skip when OPENAI_API_KEY is missing
        id: secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret not set — skipping live LLM tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live LLM pytest
        if: steps.secrets.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_NAME: gpt-4o-mini
          AGENTIC_EXECUTION_BACKEND: inprocess
          AGENTIC_PLANNER_MODEL: openai/gpt-4o-mini
          AGENTIC_PLANNER_MAX_STEPS: "2"
          AGENTIC_FINAL_QA: "0"
          AGENTIC_LEARNING: "0"
          AGENTIC_LEARNING_EVAL: "0"
        run: pytest -m live_llm -o addopts="-ra" -v
