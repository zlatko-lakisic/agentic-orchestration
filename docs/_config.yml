title: "Agentic Orchestration"
description: "Built around a coordinator that replans as it goes — model-agnostic multi-agent orchestration on CrewAI. Dynamic planning, MCP tools, agent skills playbooks, YAML catalogs."
url: "https://zlatko-lakisic.github.io"
baseurl: "/agentic-orchestration/docs"
repository: "zlatko-lakisic/agentic-orchestration"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-toc

# Google Analytics 4 (web stream: agentic-orchestration docs)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-Q8XP6XJE35"
    anonymize_ip: false

logo: "/assets/logo.png"
favicon: "/favicon.ico"

author:
  name: "Zlatko Lakisic"
  github: "zlatko-lakisic"
  linkedin: "zlatko-lakisic"

masthead_title: "Agentic Orchestration"

footer:
  links:
    - label: "Home"
      url: "https://zlatko-lakisic.github.io/agentic-orchestration/"
    - label: "GitHub"
      url: "https://github.com/zlatko-lakisic/agentic-orchestration"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/zlatko-lakisic/"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
permalink: pretty

# Build-time TOC (jekyll-toc) — ignores toc_icon; honors toc / toc_label
toc:
  min_level: 2
  max_level: 3
  ordered_list: false
  no_toc_section_class: no_toc_section
  list_id: toc
  list_class: toc-list
  sublist_class: toc-sublist
  item_class: toc-item
  item_prefix: toc-

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - README.md
  - vendor
  - agent-catalog/_catalog_body.md
  - GitLab-Wiki-publish.md
  - GitHub-Pages-publish.md
  - _Footer.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: "index.md"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
