remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

title: "Agentic Orchestration"
description: "Built around a coordinator that replans as it goes — model-agnostic multi-agent orchestration on CrewAI. Dynamic planning, MCP tools, agent skills playbooks, YAML catalogs."
url: "https://zlatko-lakisic.github.io"
baseurl: "/agentic-orchestration/docs"
repository: "zlatko-lakisic/agentic-orchestration"

# Google Analytics 4 (web stream: agentic-orchestration docs)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-Q8XP6XJE35"
    anonymize_ip: false

logo: "/assets/logo.png"
favicon: "/favicon.ico"

author:
  name: "Zlatko Lakisic"
  github: "zlatko-lakisic"
  linkedin: "zlatko-lakisic"

masthead_title: "Agentic Orchestration"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zlatko-lakisic/agentic-orchestration"

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - README.md
  - vendor
  - agent-catalog/_catalog_body.md
  - GitLab-Wiki-publish.md
  - GitHub-Pages-publish.md
  - _Footer.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: "index.md"
      type: pages
    values:
      layout: splash
      author_profile: false
