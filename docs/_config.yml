title: Agentic Orchestration
description: Model-agnostic agent orchestration with MCP tools, dynamic planning, and a web UI
url: https://zlatko-lakisic.github.io
baseurl: /agentic-orchestration
logo: assets/logo.png
image: assets/logo.png

product_nav:
  - title: Home
    url: /
  - title: Features
    url: /features/
  - title: Getting started
    url: /getting-started/
  - title: Documentation
    url: /documentation/

remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme

show_downloads: false
markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts
  - README.md
  - _Footer.md
  - GitLab-Wiki-publish.md
  - GitHub-Pages-publish.md
  - vendor
