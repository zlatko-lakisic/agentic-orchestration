<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% feed_meta %}
    {% include head/custom.html %}
    {% if site.analytics.google.tracking_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.analytics.google.tracking_id }}'{% if site.analytics.google.anonymize_ip %}, { 'anonymize_ip': true }{% endif %});
    </script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link sr-only" href="#main-content">Skip to content</a>
    {% include site-header.html %}
    {{ content }}
    {% include site-footer.html %}
    <script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
    {% if page.mermaid %}
      {% include mermaid.html %}
    {% endif %}
  </body>
</html>
