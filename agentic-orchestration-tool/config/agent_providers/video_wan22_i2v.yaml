id: video_wan22_i2v
type: video_generation
role: Vertical image-to-video (Wan 2.2)
goal: Generate a short vertical clip with real motion from a start image + prompt
backstory: >-
  Wan 2.2 image-to-video (Alibaba, Apache 2.0) via ComfyUI native nodes on Ada.
  Default graph is TI2V-5B; switch workflows.i2v to wan22_i2v_a14b_fp8.json after
  Ada bench if A14B FP8 wins on time/VRAM.
backend: comfyui
endpoint_env: AGENTIC_VIDEO_COMFYUI_URL
token_env: AGENTIC_VIDEO_COMFYUI_TOKEN
geometry: wan
quality_tier: high
speed_tier: slow
workflows:
  i2v: config/video_workflows/wan22_i2v_vertical.json
  t2v: config/video_workflows/wan22_i2v_vertical.json
bindings:
  prompt: { node: "6", field: "text" }
  negative_prompt: { node: "7", field: "text" }
  seed: { node: "3", field: "seed" }
  width: { node: "5", field: "width" }
  height: { node: "5", field: "height" }
  frames: { node: "5", field: "length" }
  image: { node: "10", field: "image" }
defaults:
  width: 544
  height: 960
  fps: 16
  frames: 81
  keep_audio: false
limits:
  max_frames: 121
  timeout_s: 2400
residency: on_demand
min_vram_gb: 12
synthetic_media: true
required_nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - CLIPTextEncode
  - LoadImage
  - Wan22ImageToVideoLatent
  - ModelSamplingSD3
  - KSampler
  - VAEDecode
  - CreateVideo
  - SaveVideo
required_weights:
  - folder: diffusion_models
    name: wan2.2_ti2v_5B_fp16.safetensors
  - folder: text_encoders
    name: umt5_xxl_fp8_e4m3fn_scaled.safetensors
  - folder: vae
    name: wan2.2_vae.safetensors
models_note: >-
  Native ComfyUI Wan 2.2 nodes (no WanVideoWrapper). Default TI2V-5B weights via
  scripts/download-comfyui-weights.sh --profile ti2v5b. A14B FP8: --profile a14b
  and point workflows at wan22_i2v_a14b_fp8.json (update bindings seed→noise_seed
  on node 20). Ada bench records seconds/5s clip, peak VRAM, peak RAM; Quill
  per-clip timeout is 30 minutes.
planner_hint: >-
  Generation only. Higher-quality image-to-video than video_ltx23_distilled
  (use LTX when speed matters). Called by AO Quill with start_image_file_id.
harness_profile: generation
harness:
  skip_live: true
