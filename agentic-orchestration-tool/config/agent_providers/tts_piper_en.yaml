id: tts_piper_en
type: tts
role: Native-English TTS (Piper)
goal: Synthesize natural English narration as WAV for AO Quill shorts
backstory: >-
  Managed Piper VITS sidecar reached only through AO direct_agent (not raw hello URLs).
  Never uses Qwen3-TTS. Prefer US/UK Piper voices for English narration.
engine: piper
allowed_engines: [piper, kokoro]
endpoint_env: AGENTIC_SPEECH_TTS_URL
token_env: AGENTIC_SPEECH_TOKEN
speech_path: /v1/audio/speech
defaults:
  voice: default
  speed: 1.0
residency: on_demand
min_vram_gb: 1
planner_exclude: true
planner_hint: >-
  Generation only. Called by AO Quill via direct_agent with text or JSON
  {text, voice, speed}. Do not select for chat.
harness_profile: generation
harness:
  skip_live: true
