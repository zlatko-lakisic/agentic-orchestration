# K4 local smoke: one step with fetch_url via worker-native stdio (mcp-server-fetch in worker image).
# Requires AGENTIC_MCP_FETCH_ENABLED=1 and AGENTIC_K8S_WORKER_STDIO_MCPS=fetch_url (default).
meta:
  id: fetch_sidecar_smoke
  summary: Fetch example.com via fetch_url MCP in K8s worker (stdio)
  description: Validates mcp-server-fetch stdio inside the worker Job pod (Option A).
  good_for:
    - K4 sidecar smoke on kind

workflow:
  name: "fetch-sidecar-smoke"
  process: "sequential"
  topic: "https://example.com"

  agent_providers:
    - id: "fetch_reader"
      type: "crewai"
      role: "URL Fetch Tester"
      goal: "Fetch a URL with the fetch MCP tool and report the page title"
      backstory: "You verify MCP fetch tooling works in Kubernetes worker pods."
      model: "gpt-4o-mini"
      verbose: true
      allow_delegation: false

  mcp_providers: []

  tasks:
    - id: "fetch_page"
      agent_provider_id: "fetch_reader"
      mcp_providers:
        - "fetch_url"
      description: >
        Use the fetch tool to retrieve the page at https://example.com (use this exact URL).
        Reply in one sentence whether the fetch succeeded and whether the content mentions "Example Domain".
      expected_output: "One sentence confirming fetch result and Example Domain mention."

  task_sequence:
    - "fetch_page"
