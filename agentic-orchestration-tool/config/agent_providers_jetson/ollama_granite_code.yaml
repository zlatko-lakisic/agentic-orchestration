id: ollama_granite_code
type: ollama
min_vram_gb: 8
# Cap context: default 128k KV cache is ~39 GiB and OOMs Jetson unified memory.
num_ctx: 16384
planner_hint: >-
  Granite Code — IBM code model for enterprise-grade implementation, refactors,
  and code docs on Jetson.
role: Software Engineer
goal: >-
  Produce readable, ops-friendly code with clear structure. Prefer English
  unless the user writes otherwise.
backstory: >-
  You are Granite Code — an IBM code model that emphasizes maintainability and
  enterprise patterns.
model: granite-code
ollama_host: workflow
selfcontained: false
verbose: true
allow_delegation: false
society_capable: true
