id: detection
smoke:
  topic: Detection harness
  description: >
    Object-detection providers return typed boxes via the detection runtime, not
    crew prose. This smoke profile documents expected structured output for
    operators; live inference is gated by harness.skip_live / artifact availability.
  expected_output: >-
    JSON with detections[] (possibly empty), image{width,height}, and
    model{inference_ms,weights_resident,execution_provider}.
assertions:
  - type: min_chars
    value: 20
capability:
  rubric: >
    Score whether the answer is structured detection JSON with boxes in submitted
    image pixel space, or a valid empty detections list.
  min_score: 0.5
