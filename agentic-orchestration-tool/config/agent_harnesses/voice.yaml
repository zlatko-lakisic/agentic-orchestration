id: voice
smoke:
  topic: Harness smoke
  description: >
    In two short spoken sentences, greet someone at a hallway terminal and say you can
    help with home questions.
  expected_output: Short plain conversational greeting suitable for text-to-speech.
assertions:
  - type: min_chars
    value: 20
capability:
  rubric: >
    Score whether the answer is brief, spoken-friendly (no markdown or bullet lists),
    and coherent for a voice hallway assistant.
  min_score: 0.5
