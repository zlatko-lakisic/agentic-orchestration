# Optional: pre-pull worker image on each node (K4.4).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agentic-worker-image-prep
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-worker-image-prep
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-worker-image-prep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-worker-image-prep
    spec:
      initContainers:
        - name: pull-worker
          image: agentic-orchestrator-worker:local
          command: ["sh", "-c", "echo pulled"]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
