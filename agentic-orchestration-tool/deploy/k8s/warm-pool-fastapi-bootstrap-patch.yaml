# Patch-only: install fastapi at startup when the worker image predates the litellm
# MCP dependency. Does not touch volumeMounts — safe after jetson-hotfix-web patches.
spec:
  template:
    spec:
      containers:
        - name: worker
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              resolve_python() {
                if [[ -x /app/tool/.venv/bin/python ]]; then
                  echo /app/tool/.venv/bin/python
                  return
                fi
                local candidate="${AGENTIC_PYTHON:-}"
                if [[ -n "${candidate}" ]]; then
                  if [[ "${candidate}" == */* ]]; then
                    if [[ -x "${candidate}" ]]; then
                      echo "${candidate}"
                      return
                    fi
                  elif command -v "${candidate}" >/dev/null 2>&1; then
                    command -v "${candidate}"
                    return
                  fi
                fi
                command -v python 2>/dev/null || command -v python3 2>/dev/null || echo python
              }
              PY="$(resolve_python)"
              if ! "${PY}" -c "import fastapi" >/dev/null 2>&1; then
                echo "Installing fastapi for litellm MCP handler (${PY}) ..."
                if ! "${PY}" -m pip install --break-system-packages -q "fastapi>=0.115.0,<1" 2>/dev/null; then
                  "${PY}" -m pip install -q "fastapi>=0.115.0,<1"
                fi
              fi
              "${PY}" -c "import fastapi; print('fastapi_ok', fastapi.__version__)"
              exec "${PY}" main.py --warm-pool-worker
