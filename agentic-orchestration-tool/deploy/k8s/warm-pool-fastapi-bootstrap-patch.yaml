# Patch-only: fastapi for litellm MCP. Safe after jetson-hotfix-web volume patches.
#
# Jetson and Ada both run the worker *image* python (/usr/local/bin/python).
# Never exec a host .venv interpreter — Ada's venv is /usr/bin/python3.12 and
# Jetson's would be a different prefix too. Override AGENTIC_PYTHON from the
# Secret (coordinator venv path) so workers do not inherit it.
spec:
  template:
    spec:
      containers:
        - name: worker
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PY="$(command -v python 2>/dev/null || command -v python3 2>/dev/null || echo python)"
              needs_stack() {
                "${PY}" - <<'PY' >/dev/null 2>&1
import fastapi
import crewai
from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter  # noqa: F401
def _tuple(v: str):
    parts = []
    for p in str(v).split("."):
        n = ""
        for ch in p:
            if ch.isdigit():
                n += ch
            else:
                break
        parts.append(int(n or "0"))
    return tuple(parts)
assert _tuple(crewai.__version__) >= (1, 15, 0)
assert _tuple(fastapi.__version__) >= (0, 142, 0)
PY
              }
              if ! needs_stack; then
                echo "Aligning warm-pool CrewAI 1.15.41 + FastAPI/OpenTelemetry 1.45 (${PY}) ..."
                "${PY}" -m pip install --break-system-packages \
                  "crewai==1.15.41" \
                  "fastapi>=0.142,<1" \
                  "opentelemetry-api==1.45.2" \
                  "opentelemetry-sdk==1.45.2" \
                  "opentelemetry-exporter-otlp-proto-http==1.45.2" \
                  "opentelemetry-exporter-otlp-proto-grpc==1.45.2" \
                  "packaging" || true
              fi
              if ! needs_stack; then
                shopt -s nullglob
                for d in /app/tool/.venv/lib/python3.*/site-packages; do
                  export PYTHONPATH="${d}${PYTHONPATH:+:${PYTHONPATH}}"
                  break
                done
                shopt -u nullglob
              fi
              if ! needs_stack; then
                echo "error: warm-pool CrewAI/FastAPI/OpenTelemetry stack not ready for ${PY}" >&2
                exit 1
              fi
              "${PY}" -c "import crewai,fastapi,sys; print('stack_ok', 'crewai', crewai.__version__, 'fastapi', fastapi.__version__, 'py', sys.executable)"
              exec "${PY}" main.py --warm-pool-worker
          env:
            - name: AGENTIC_PYTHON
              value: python
