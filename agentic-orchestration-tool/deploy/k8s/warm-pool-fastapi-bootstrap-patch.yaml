# Patch-only: fastapi for litellm MCP. Safe after jetson-hotfix-web volume patches.
#
# Jetson and Ada both run the worker *image* python (/usr/local/bin/python).
# Never exec a host .venv interpreter — Ada's venv is /usr/bin/python3.12 and
# Jetson's would be a different prefix too. Override AGENTIC_PYTHON from the
# Secret (coordinator venv path) so workers do not inherit it.
spec:
  template:
    spec:
      containers:
        - name: worker
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PY="$(command -v python 2>/dev/null || command -v python3 2>/dev/null || echo python)"
              ensure_fastapi() {
                "${PY}" -c "import fastapi" >/dev/null 2>&1
              }
              if ! ensure_fastapi; then
                echo "Installing fastapi for litellm MCP handler (${PY}) ..."
                "${PY}" -m pip install --break-system-packages "fastapi>=0.115.0,<1" || true
              fi
              if ! ensure_fastapi; then
                shopt -s nullglob
                for d in /app/tool/.venv/lib/python3.*/site-packages; do
                  export PYTHONPATH="${d}${PYTHONPATH:+:${PYTHONPATH}}"
                  break
                done
                shopt -u nullglob
              fi
              if ! ensure_fastapi; then
                echo "error: fastapi missing for ${PY} (pip failed; host venv site-packages not usable)" >&2
                exit 1
              fi
              "${PY}" -c "import fastapi,sys; print('fastapi_ok', fastapi.__version__, 'py', sys.executable)"
              exec "${PY}" main.py --warm-pool-worker
          env:
            - name: AGENTIC_PYTHON
              value: python
