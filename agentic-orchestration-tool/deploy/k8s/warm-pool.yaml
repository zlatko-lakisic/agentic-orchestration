# Warm pool: idle worker pods dequeue steps from the run-store PVC (K5.1).
# Enable on coordinator: AGENTIC_K8S_WARM_POOL_ENABLED=1
# Steps with in-pod MCP sidecars still use one-shot Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-warm-pool
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-warm-pool
    app.kubernetes.io/component: warm-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-warm-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-warm-pool
        app.kubernetes.io/component: warm-pool
    spec:
      containers:
        - name: worker
          image: agentic-orchestrator-worker:local
          imagePullPolicy: IfNotPresent
          # Bootstrap fastapi when the local worker image predates the litellm
          # MCP → fastapi dependency (requirements.txt). Survives until the
          # worker image is rebuilt with fastapi baked in.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PY="$(command -v python 2>/dev/null || command -v python3 2>/dev/null || echo python)"
              ensure_fastapi() {
                "${PY}" -c "import fastapi" >/dev/null 2>&1
              }
              if ! ensure_fastapi; then
                echo "Installing fastapi for litellm MCP handler (${PY}) ..."
                "${PY}" -m pip install --break-system-packages "fastapi>=0.115.0,<1" || true
              fi
              if ! ensure_fastapi; then
                shopt -s nullglob
                for d in /app/tool/.venv/lib/python3.*/site-packages; do
                  export PYTHONPATH="${d}${PYTHONPATH:+:${PYTHONPATH}}"
                  break
                done
                shopt -u nullglob
              fi
              if ! ensure_fastapi; then
                echo "error: fastapi missing for ${PY} (pip failed; host venv site-packages not usable)" >&2
                exit 1
              fi
              "${PY}" -c "import fastapi,sys; print('fastapi_ok', fastapi.__version__, 'py', sys.executable)"
              exec "${PY}" main.py --warm-pool-worker
          env:
            - name: AGENTIC_RUN_STORE_PATH
              value: /run/store
            - name: AGENTIC_TOOL_ROOT
              value: /app
            - name: AGENTIC_LOG_FORMAT
              value: json
            - name: AGENTIC_PYTHON
              value: python
          envFrom:
            - secretRef:
                name: agentic-orchestrator-env
                optional: true
          volumeMounts:
            - name: run-store
              mountPath: /run/store
            # Admin Traces + Token usage: same host dirs as coordinator/engine.
            - name: run-traces
              mountPath: /app/__orchestrator_run_traces__
            - name: llm-usage
              mountPath: /app/__orchestrator_llm_usage__
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: run-store
          persistentVolumeClaim:
            claimName: agentic-run-store
        - name: run-traces
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/__orchestrator_run_traces__
            type: DirectoryOrCreate
        - name: llm-usage
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/__orchestrator_llm_usage__
            type: DirectoryOrCreate
