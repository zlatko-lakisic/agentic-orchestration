# Warm pool: idle worker pods dequeue steps from the run-store PVC (K5.1).
# Enable on coordinator: AGENTIC_K8S_WARM_POOL_ENABLED=1
# Steps with in-pod MCP sidecars still use one-shot Jobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-warm-pool
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-warm-pool
    app.kubernetes.io/component: warm-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-warm-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-warm-pool
        app.kubernetes.io/component: warm-pool
    spec:
      containers:
        - name: worker
          image: agentic-orchestrator-worker:local
          imagePullPolicy: IfNotPresent
          # No setuid helpers are used; forbid gaining privileges. The container
          # still runs as the image user (root): it writes hostPath/PVC directories
          # owned by other uids and installs packages at start, so runAsNonRoot and
          # dropped capabilities are not safe defaults here (see README, Hardening).
          securityContext:
            allowPrivilegeEscalation: false
          # Bootstrap fastapi when the local worker image predates the litellm
          # MCP → fastapi dependency (requirements.txt). Survives until the
          # worker image is rebuilt with fastapi baked in.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PY="$(command -v python 2>/dev/null || command -v python3 2>/dev/null || echo python)"
              needs_stack() {
                # Keep this as python -c (no bash heredoc): YAML literal blocks break if
                # unindented heredoc body lines fall below the block indent.
                "${PY}" -c 'import fastapi,crewai; from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter as _; t=lambda v:tuple(int("".join(ch for ch in p if ch.isdigit()) or "0") for p in str(v).split(".")); assert t(crewai.__version__)>=(1,15,0); assert t(fastapi.__version__)>=(0,142,0)' >/dev/null 2>&1
              }
              if ! needs_stack; then
                echo "Aligning warm-pool CrewAI 1.15.41 + FastAPI/OpenTelemetry 1.45 (${PY}) ..."
                "${PY}" -m pip install --break-system-packages \
                  "crewai==1.15.41" \
                  "fastapi>=0.142,<1" \
                  "opentelemetry-api==1.45.2" \
                  "opentelemetry-sdk==1.45.2" \
                  "opentelemetry-exporter-otlp-proto-http==1.45.2" \
                  "opentelemetry-exporter-otlp-proto-grpc==1.45.2" || true
              fi
              if ! needs_stack; then
                shopt -s nullglob
                for d in /app/tool/.venv/lib/python3.*/site-packages; do
                  export PYTHONPATH="${d}${PYTHONPATH:+:${PYTHONPATH}}"
                  break
                done
                shopt -u nullglob
              fi
              if ! needs_stack; then
                echo "error: warm-pool CrewAI/FastAPI/OpenTelemetry stack not ready for ${PY}" >&2
                exit 1
              fi
              "${PY}" -c "import crewai,fastapi,sys; print('stack_ok', 'crewai', crewai.__version__, 'fastapi', fastapi.__version__, 'py', sys.executable)"
              exec "${PY}" main.py --warm-pool-worker
          env:
            - name: AGENTIC_RUN_STORE_PATH
              value: /run/store
            - name: AGENTIC_TOOL_ROOT
              value: /app
            - name: AGENTIC_LOG_FORMAT
              value: json
            - name: AGENTIC_PYTHON
              value: python
          envFrom:
            - secretRef:
                name: agentic-orchestrator-env
                optional: true
          volumeMounts:
            - name: run-store
              mountPath: /run/store
            # Admin Traces + Token usage: same host dirs as coordinator/engine.
            - name: run-traces
              mountPath: /app/__orchestrator_run_traces__
            - name: llm-usage
              mountPath: /app/__orchestrator_llm_usage__
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: run-store
          persistentVolumeClaim:
            claimName: agentic-run-store
        - name: run-traces
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/__orchestrator_run_traces__
            type: DirectoryOrCreate
        - name: llm-usage
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/__orchestrator_llm_usage__
            type: DirectoryOrCreate
