# In-cluster Ollama for AGENTIC_OLLAMA_MODE=managed_k8s.
# Models persist on hostPath under the AO project tree (Ada / default).
# Jetson (no local disk): jetson-enable-ollama.sh also mounts
# AGENTIC_OLLAMA_MODELS_HOSTPATH (e.g. /nfs/omega-jetson/ollama/models) at
# /root/.ollama/models so NFS-backed host installs keep working without a copy.
#
# Ada / x86 GPU: k3s here has RuntimeClass "nvidia" but containerd does not
# register the handler ("RuntimeHandler nvidia not supported"). Use privileged
# hostPath device + driver-lib mounts instead so Ollama sees the discrete GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ollama
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-ollama
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ollama
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: LD_LIBRARY_PATH
              value: /host-nvidia-libs:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          securityContext:
            privileged: true
          volumeMounts:
            - name: ollama-home
              mountPath: /root/.ollama
            - name: nvidia0
              mountPath: /dev/nvidia0
            - name: nvidiactl
              mountPath: /dev/nvidiactl
            - name: nvidiauvm
              mountPath: /dev/nvidia-uvm
            - name: nvidiauvmtools
              mountPath: /dev/nvidia-uvm-tools
            - name: nvidiamodeset
              mountPath: /dev/nvidia-modeset
            - name: nvidiacaps
              mountPath: /dev/nvidia-caps
            - name: host-nvidia-libs
              mountPath: /host-nvidia-libs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              memory: 16Gi
      volumes:
        - name: ollama-home
          hostPath:
            path: /var/projects/agentic-orchestration/var/ollama-models
            type: DirectoryOrCreate
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
        - name: nvidiactl
          hostPath:
            path: /dev/nvidiactl
        - name: nvidiauvm
          hostPath:
            path: /dev/nvidia-uvm
        - name: nvidiauvmtools
          hostPath:
            path: /dev/nvidia-uvm-tools
        - name: nvidiamodeset
          hostPath:
            path: /dev/nvidia-modeset
        - name: nvidiacaps
          hostPath:
            path: /dev/nvidia-caps
            type: DirectoryOrCreate
        - name: host-nvidia-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
