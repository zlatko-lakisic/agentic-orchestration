# In-cluster Ollama for AGENTIC_OLLAMA_MODE=managed_k8s.
# Models persist on hostPath under the AO project tree (Ada / default).
# Jetson: jetson-enable-ollama.sh uses AGENTIC_OLLAMA_MODELS_HOSTPATH
# (default /mnt/nvme/ollama/models; legacy NFS is fallback only) via nsenter.
#
# Ada / x86 GPU: k3s may advertise RuntimeClass "nvidia" without a working
# containerd handler. Mount NVIDIA devices + host driver libs, then symlink
# libcuda into standard paths before `ollama serve` so runners use the GPU.
# Override via AGENTIC_OLLAMA_IMAGE (env.jetson). Ollama 0.32+ needs NVIDIA driver 550+.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ollama
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-ollama
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ollama
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              LIBDIR=/usr/lib/x86_64-linux-gnu
              mkdir -p "$LIBDIR"
              for f in /host-nvidia-libs/libcuda.so* \
                       /host-nvidia-libs/libnvidia-ml.so* \
                       /host-nvidia-libs/libnvidia-ptxjitcompiler.so* \
                       /host-nvidia-libs/libnvidia-nvvm.so* \
                       /host-nvidia-libs/libnvidia-gpucomp.so* \
                       /host-nvidia-libs/libnvidia-cfg.so*; do
                [ -e "$f" ] || continue
                ln -sfn "$f" "$LIBDIR/$(basename "$f")"
                if [ -d /usr/lib/ollama ]; then
                  ln -sfn "$f" "/usr/lib/ollama/$(basename "$f")"
                fi
              done
              if [ -x /host-nvidia-bin/nvidia-smi ]; then
                ln -sfn /host-nvidia-bin/nvidia-smi /usr/bin/nvidia-smi
              fi
              ldconfig 2>/dev/null || true
              echo "GPU probe:"; nvidia-smi -L 2>&1 || true
              exec ollama serve
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            # Cap default context so large-context models do not OOM the host.
            # Override via AGENTIC_OLLAMA_CONTEXT_LENGTH before applying this manifest.
            - name: OLLAMA_CONTEXT_LENGTH
              value: "16384"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu:/host-nvidia-libs:/usr/lib/ollama:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          securityContext:
            privileged: true
          volumeMounts:
            - name: ollama-home
              mountPath: /root/.ollama
            - name: nvidia0
              mountPath: /dev/nvidia0
            - name: nvidiactl
              mountPath: /dev/nvidiactl
            - name: nvidiauvm
              mountPath: /dev/nvidia-uvm
            - name: nvidiauvmtools
              mountPath: /dev/nvidia-uvm-tools
            - name: nvidiamodeset
              mountPath: /dev/nvidia-modeset
            - name: nvidiacaps
              mountPath: /dev/nvidia-caps
            - name: host-nvidia-libs
              mountPath: /host-nvidia-libs
              readOnly: true
            - name: host-nvidia-bin
              mountPath: /host-nvidia-bin
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              memory: 16Gi
      volumes:
        - name: ollama-home
          hostPath:
            path: /var/projects/agentic-orchestration/var/ollama-models
            type: DirectoryOrCreate
        - name: nvidia0
          hostPath:
            path: /dev/nvidia0
        - name: nvidiactl
          hostPath:
            path: /dev/nvidiactl
        - name: nvidiauvm
          hostPath:
            path: /dev/nvidia-uvm
        - name: nvidiauvmtools
          hostPath:
            path: /dev/nvidia-uvm-tools
        - name: nvidiamodeset
          hostPath:
            path: /dev/nvidia-modeset
        - name: nvidiacaps
          hostPath:
            path: /dev/nvidia-caps
            type: DirectoryOrCreate
        - name: host-nvidia-libs
          hostPath:
            path: /usr/lib/x86_64-linux-gnu
            type: Directory
        - name: host-nvidia-bin
          hostPath:
            path: /usr/bin
            type: Directory
