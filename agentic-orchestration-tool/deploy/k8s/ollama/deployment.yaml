# In-cluster Ollama for AGENTIC_OLLAMA_MODE=managed_k8s.
# Models persist on hostPath under the AO project tree (Ada / default).
# Jetson (no local disk): jetson-enable-ollama.sh also mounts
# AGENTIC_OLLAMA_MODELS_HOSTPATH (e.g. /nfs/omega-jetson/ollama/models) at
# /root/.ollama/models so NFS-backed host installs keep working without a copy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ollama
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-ollama
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ollama
        app.kubernetes.io/component: ollama
    spec:
      # x86/NVR (Ada): use NVIDIA container runtime so Ollama sees the discrete GPU.
      # Jetson aarch64 does not use this manifest — host-binary nsenter mode instead.
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          volumeMounts:
            - name: ollama-home
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              memory: 16Gi
      volumes:
        - name: ollama-home
          hostPath:
            path: /var/projects/agentic-orchestration/var/ollama-models
            type: DirectoryOrCreate
