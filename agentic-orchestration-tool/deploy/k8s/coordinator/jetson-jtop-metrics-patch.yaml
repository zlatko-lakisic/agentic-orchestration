# Mount host metrics JSON (Jetson / CUDA / AMD writers → shared dir).
spec:
  template:
    spec:
      containers:
        - name: coordinator
          env:
            - name: AGENTIC_JETSON_JTOP_METRICS_PATH
              value: /host/agentic-metrics/jtop-metrics.json
            - name: AGENTIC_NVIDIA_HOST_METRICS_PATH
              value: /host/agentic-metrics/nvidia-metrics.json
            - name: AGENTIC_AMD_HOST_METRICS_PATH
              value: /host/agentic-metrics/amd-metrics.json
          volumeMounts:
            - name: host-agentic-metrics
              mountPath: /host/agentic-metrics
              readOnly: true
      volumes:
        - name: host-agentic-metrics
          hostPath:
            path: /var/projects/agentic-orchestration/var/agentic-metrics
            type: DirectoryOrCreate
