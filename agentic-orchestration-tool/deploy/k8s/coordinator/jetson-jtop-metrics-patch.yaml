# Mount host metrics JSON (jtop on Jetson, nvidia-smi writer on discrete GPU hosts).
spec:
  template:
    spec:
      containers:
        - name: coordinator
          env:
            - name: AGENTIC_JETSON_JTOP_METRICS_PATH
              value: /host/agentic-metrics/jtop-metrics.json
            - name: AGENTIC_NVIDIA_HOST_METRICS_PATH
              value: /host/agentic-metrics/nvidia-metrics.json
          volumeMounts:
            - name: host-agentic-metrics
              mountPath: /host/agentic-metrics
              readOnly: true
      volumes:
        - name: host-agentic-metrics
          hostPath:
            path: /var/run/agentic
            type: DirectoryOrCreate
