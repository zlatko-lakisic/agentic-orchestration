# Jetson: hostPort 80 with Recreate strategy (see jetson-coordinator-rollout-patch.yaml).
# Do not use RollingUpdate with hostPort on single-node k3s — rollout deadlock.
spec:
  template:
    spec:
      containers:
        - name: coordinator
          ports:
            - name: http
              containerPort: 3847
              hostPort: 80
              protocol: TCP
