# DEPRECATED for Jetson: hostPort 80 causes RollingUpdate deadlock on single-node k3s.
# Use jetson-coordinator-rollout-patch.yaml (Recreate, no hostPort) +
# service-nodeport.yaml + scripts/jetson-web-port-redirect.sh instead.
spec:
  template:
    spec:
      containers:
        - name: coordinator
          ports:
            - name: http
              containerPort: 3847
              hostPort: 80
              protocol: TCP
