# DEPRECATED for Jetson: hostPort 80 causes RollingUpdate deadlock on single-node k3s.
# Use jetson-coordinator-rollout-patch.yaml (Recreate, no hostPort) + service-nodeport.yaml.
spec:
  template:
    spec:
      containers:
        - name: coordinator
          ports:
            - name: http
              containerPort: 3847
              protocol: TCP
