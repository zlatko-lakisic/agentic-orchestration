# Mount git-synced web UI assets over the coordinator image (no docker rebuild).
spec:
  template:
    spec:
      containers:
        - name: coordinator
          volumeMounts:
            - name: web-hotfix-public
              mountPath: /app/web/public/app.js
              subPath: app.js
            - name: web-hotfix-public
              mountPath: /app/web/public/index.html
              subPath: index.html
            - name: web-hotfix-public
              mountPath: /app/web/public/styles.css
              subPath: styles.css
            - name: web-hotfix-public
              mountPath: /app/web/public/host-metrics-ui.js
              subPath: host-metrics-ui.js
            - name: web-hotfix-public
              mountPath: /app/web/public/perf-options.js
              subPath: perf-options.js
            - name: web-hotfix-public
              mountPath: /app/web/public/crew-log-sequence.js
              subPath: crew-log-sequence.js
            - name: web-hotfix-public
              mountPath: /app/web/public/chat-output.js
              subPath: chat-output.js
            - name: web-hotfix-public
              mountPath: /app/web/public/text-normalize.js
              subPath: text-normalize.js
            - name: web-hotfix-public
              mountPath: /app/web/public/user-context.js
              subPath: user-context.js
            - name: web-hotfix-public
              mountPath: /app/web/public/install-prompt.js
              subPath: install-prompt.js
            - name: web-hotfix-public
              mountPath: /app/web/public/proxy-context.js
              subPath: proxy-context.js
            - name: web-hotfix-public
              mountPath: /app/web/public/ws-singleton.js
              subPath: ws-singleton.js
            - name: web-hotfix-public
              mountPath: /app/web/public/pwa-manifest-data.js
              subPath: pwa-manifest-data.js
            - name: web-hotfix-public
              mountPath: /app/web/public/pwa-manifest-link.js
              subPath: pwa-manifest-link.js
            - name: web-hotfix-public
              mountPath: /app/web/public/chat-session.js
              subPath: chat-session.js
            - name: web-hotfix-public
              mountPath: /app/web/public/manifest.webmanifest
              subPath: manifest.webmanifest
            - name: web-hotfix-public
              mountPath: /app/web/public/sw.js
              subPath: sw.js
            - name: web-hotfix-root
              mountPath: /app/web/server.mjs
              subPath: server.mjs
            - name: web-hotfix-root
              mountPath: /app/web/host-metrics.mjs
              subPath: host-metrics.mjs
            - name: web-hotfix-root
              mountPath: /app/web/lib/perf-options.mjs
              subPath: perf-options.mjs
            - name: web-hotfix-root
              mountPath: /app/web/lib/ollama-keepalive.mjs
              subPath: ollama-keepalive.mjs
            - name: web-hotfix-root
              mountPath: /app/web/lib/chat-output.mjs
              subPath: chat-output.mjs
            - name: web-hotfix-root
              mountPath: /app/web/lib/text-normalize.mjs
              subPath: text-normalize.mjs
            - name: web-hotfix-root
              mountPath: /app/web/lib/user-context.mjs
              subPath: user-context.mjs
      volumes:
        - name: web-hotfix-public
          configMap:
            name: agentic-web-hotfix-public
        - name: web-hotfix-root
          configMap:
            name: agentic-web-hotfix-root
