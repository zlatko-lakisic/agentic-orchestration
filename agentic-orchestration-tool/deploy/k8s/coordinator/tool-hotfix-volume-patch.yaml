            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_retrieve.py
              subPath: rag_retrieve.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_embeddings.py
              subPath: rag_embeddings.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_context.py
              subPath: rag_context.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_apply.py
              subPath: rag_apply.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_tool.py
              subPath: rag_tool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/rag_grounding.py
              subPath: rag_grounding.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/backends/base.py
              subPath: backends_base.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/backends/crewai.py
              subPath: backends_crewai.py
            - name: tool-hotfix-agent-providers
              mountPath: /app/tool/agent_providers/base.py
              subPath: base.py
            - name: tool-hotfix-agent-providers
              mountPath: /app/tool/agent_providers/ollama_provider.py
              subPath: ollama_provider.py
      volumes:
        - name: tool-hotfix-orchestration
          configMap:
            name: agentic-tool-hotfix-orchestration
        - name: tool-hotfix-agent-providers
          configMap:
            name: agentic-tool-hotfix-agent-providers
