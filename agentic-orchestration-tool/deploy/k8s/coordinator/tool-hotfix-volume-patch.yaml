# Mount git-synced orchestration Python over the coordinator image (no docker rebuild).
spec:
  template:
    spec:
      containers:
        - name: coordinator
          volumeMounts:
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/main.py
              subPath: main.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/dynamic_planner.py
              subPath: dynamic_planner.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/provider_goal_match.py
              subPath: provider_goal_match.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/ollama_keepalive.py
              subPath: ollama_keepalive.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/backends/kubernetes_warm_pool.py
              subPath: kubernetes_warm_pool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/execute_step.py
              subPath: execute_step.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/k8s_delegation_tool.py
              subPath: k8s_delegation_tool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/simple_chat.py
              subPath: simple_chat.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/planner_greeting.py
              subPath: planner_greeting.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/text_normalize.py
              subPath: text_normalize.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/mcp_task_hints.py
              subPath: mcp_task_hints.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/mcp_tool_leak_recovery.py
              subPath: mcp_tool_leak_recovery.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/irrigation_minutes.py
              subPath: irrigation_minutes.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/goal_format_hints.py
              subPath: goal_format_hints.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/output_artifacts.py
              subPath: output_artifacts.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/fetch_url_tool.py
              subPath: fetch_url_tool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/step_context.py
              subPath: step_context.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/video_vision_synopsis.py
              subPath: video_vision_synopsis.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/mcp_providers_catalog.py
              subPath: mcp_providers_catalog.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/k8s_mcp_compat.py
              subPath: k8s_mcp_compat.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/workflow_materializer.py
              subPath: workflow_materializer.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/attachments.py
              subPath: attachments.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/cloud_anonymize.py
              subPath: cloud_anonymize.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/cloud_anonymize_tier3.py
              subPath: cloud_anonymize_tier3.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/knowledge_base.py
              subPath: knowledge_base.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/orchestrator_session.py
              subPath: orchestrator_session.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/media_grounding.py
              subPath: media_grounding.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/crewai_mcp_normalize.py
              subPath: crewai_mcp_normalize.py
            - name: tool-hotfix-orchestration
              mountPath: /app/tool/orchestration/runner.py
              subPath: runner.py
