# Mount git-synced runtime_bootstrap.py (ConfigMap hotfix is at the 1MiB limit).
# After git pull, pods see the new ensure_planner_runtime_if_ollama without an image rebuild.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-coordinator
  namespace: agentic-orchestration
spec:
  template:
    spec:
      containers:
        - name: web
          volumeMounts:
            - name: jetson-runtime-bootstrap
              mountPath: /app/tool/orchestration/runtime_bootstrap.py
              subPath: runtime_bootstrap.py
      volumes:
        - name: jetson-runtime-bootstrap
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/orchestration
            type: Directory
