# Mount git-synced orchestration modules that no longer fit in the 1MiB ConfigMap hotfix.
# After git pull, pods see these without an image rebuild.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-coordinator
  namespace: agentic-orchestration
spec:
  template:
    spec:
      containers:
        - name: coordinator
          volumeMounts:
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/runtime_bootstrap.py
              subPath: runtime_bootstrap.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/ollama_ownership.py
              subPath: ollama_ownership.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/ollama_catalog_filter.py
              subPath: ollama_catalog_filter.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/host_metrics.py
              subPath: host_metrics.py
            # Imported unguarded by ollama_provider / serve.app; too large to add
            # to the orchestration ConfigMap, which is at the 1 MiB limit.
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/ollama_resource_manager.py
              subPath: ollama_resource_manager.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/reach_multimodal.py
              subPath: reach_multimodal.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/mcp_stdio_hygiene.py
              subPath: mcp_stdio_hygiene.py
            - name: jetson-orch-hostpath
              mountPath: /app/tool/orchestration/mcp_stdio_jsonrpc_filter.py
              subPath: mcp_stdio_jsonrpc_filter.py
      volumes:
        - name: jetson-orch-hostpath
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/orchestration
            type: Directory
