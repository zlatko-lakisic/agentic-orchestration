# Jetson / single-node: reliable coordinator rollouts (no hostPort).
# - Recreate: terminate old pod before starting new (required when hostPort was used).
# - NodePort 30487: Traefik / Warpgate upstream (no hostPort, no iptables :80 redirect).
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: coordinator
          ports:
            - name: http
              containerPort: 3847
              protocol: TCP
