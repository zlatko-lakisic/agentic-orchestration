# Jetson / single-node: reliable coordinator rollouts with hostPort 80.
# - Recreate: terminate old pod before starting new (avoids hostPort deadlock).
# - hostPort 80: Traefik / Warpgate upstream expects direct host binding (WebSocket-safe).
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: coordinator
          ports:
            - name: http
              containerPort: 3847
              hostPort: 80
              protocol: TCP
