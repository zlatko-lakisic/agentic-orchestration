# Mount git-synced RAG sources YAML catalog into the coordinator (no docker rebuild).
spec:
  template:
    spec:
      containers:
        - name: coordinator
          volumeMounts:
            - name: jetson-rag-sources
              mountPath: /app/tool/config/rag_sources
              readOnly: true
      volumes:
        - name: jetson-rag-sources
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/config/rag_sources
            type: DirectoryOrCreate
