apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-coordinator
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-coordinator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # Warm-pool autoscale (orchestration/execution_queue_broker.py) scales through the
  # scale subresource; "deployments: patch" alone does not grant it.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
