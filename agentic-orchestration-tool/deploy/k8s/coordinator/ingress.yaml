apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-coordinator
  namespace: agentic-orchestration
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-coordinator
                port:
                  number: 3847
