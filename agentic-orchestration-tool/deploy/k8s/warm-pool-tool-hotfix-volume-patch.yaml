# Mount git-synced orchestration Python over the warm-pool worker image (no docker rebuild).
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/ollama_keepalive.py
