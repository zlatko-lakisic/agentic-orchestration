# Mount git-synced orchestration Python over the warm-pool worker image (no docker rebuild).
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/ollama_keepalive.py
              subPath: ollama_keepalive.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/backends/kubernetes_warm_pool.py
              subPath: kubernetes_warm_pool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/execute_step.py
              subPath: execute_step.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/k8s_delegation_tool.py
              subPath: k8s_delegation_tool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/simple_chat.py
              subPath: simple_chat.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/mcp_task_hints.py
              subPath: mcp_task_hints.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/irrigation_minutes.py
              subPath: irrigation_minutes.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/goal_format_hints.py
              subPath: goal_format_hints.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/text_normalize.py
              subPath: text_normalize.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/fetch_url_tool.py
              subPath: fetch_url_tool.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/k8s_mcp_compat.py
              subPath: k8s_mcp_compat.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/attachments.py
              subPath: attachments.py
            - name: tool-hotfix-orchestration
              mountPath: /app/orchestration/media_grounding.py
              subPath: media_grounding.py
            - name: tool-hotfix-agent-providers
              mountPath: /app/agent_providers/base.py
              subPath: base.py
            - name: tool-hotfix-agent-providers
              mountPath: /app/agent_providers/ollama_provider.py
              subPath: ollama_provider.py
      volumes:
        - name: tool-hotfix-orchestration
          configMap:
            name: agentic-tool-hotfix-orchestration
        - name: tool-hotfix-agent-providers
          configMap:
            name: agentic-tool-hotfix-agent-providers
