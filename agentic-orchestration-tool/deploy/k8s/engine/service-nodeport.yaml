# NodePort alternate for the engine daemon (when hostPort 8765 is unavailable).
# Prefer http://<jetson>:8765 (hostPort on the Deployment). This Service is
# http://<jetson>:30765 — same process, different publish path. Web UI stays on 30487.
apiVersion: v1
kind: Service
metadata:
  name: agentic-engine-nodeport
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-engine
    app.kubernetes.io/component: engine
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: agentic-engine
  ports:
    - name: engine
      port: 8765
      targetPort: 8765
      nodePort: 30765
