# Engine API daemon (python -m orchestration.serve) — additive alongside the Node web UI.
# Does NOT replace agentic-coordinator (NodePort 30487). Reach / REST clients use this
# process on port 8765 (hostPort) or NodePort 30765.
#
# Image: same coordinator image (Python + CrewAI deps). Tool tree is hostPath-mounted from
# the git checkout so jetson-deploy.sh pull is enough — no docker rebuild for serve code.
# That mount includes __orchestrator_llm_usage__ and __orchestrator_run_traces__ so Admin
# (coordinator hostPath mounts of the same dirs) sees every local client's ledger/traces.
# FastAPI/uvicorn and the OpenTelemetry 1.45.2 set install at start from
# requirements-serve.txt when the image is missing them or has drifted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-engine
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-engine
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-engine
        app.kubernetes.io/component: engine
    spec:
      # Same SA as coordinator — needs batch/jobs (+ pods/log) to spawn worker Jobs.
      # Default SA gets 403 on jobs.batch create (Comstar/Reach dynamic execution).
      serviceAccountName: agentic-coordinator
      # Single-node Jetson: hostPort 8765 → http://<jetson>:8765 for Reach clients.
      # Recreate avoids hostPort conflicts during rollout.
      containers:
        - name: engine
          image: agentic-orchestrator-coordinator:local
          imagePullPolicy: IfNotPresent
          # No setuid helpers are used; forbid gaining privileges. The container
          # still runs as the image user (root): it writes hostPath/PVC directories
          # owned by other uids and installs packages at start, so runAsNonRoot and
          # dropped capabilities are not safe defaults here (see README, Hardening).
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          workingDir: /app/tool
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              cd /app/tool
              # Reconcile even when fastapi already imports. Image site-packages
              # survive a git pull, and a mixed API/SDK/exporter set can fail at
              # import time. requirements-serve.txt pins the complete 1.45.2 set.
              if ! python -c 'import fastapi, uvicorn
              from importlib.metadata import version
              from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter as GrpcExporter
              from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter as HttpExporter
              expected = {
                  "opentelemetry-api": "1.45.2",
                  "opentelemetry-sdk": "1.45.2",
                  "opentelemetry-exporter-otlp-proto-common": "1.45.2",
                  "opentelemetry-exporter-otlp-proto-grpc": "1.45.2",
                  "opentelemetry-exporter-otlp-proto-http": "1.45.2",
                  "opentelemetry-proto": "1.45.2",
                  "opentelemetry-semantic-conventions": "0.66b2",
              }
              raise SystemExit(0 if all(version(name) == wanted for name, wanted in expected.items()) else 1)'; then
                echo "Aligning FastAPI and OpenTelemetry 1.45.2 ..."
                pip install -q --upgrade -r requirements-serve.txt
              fi
              exec python -m orchestration.serve
          ports:
            - name: engine
              containerPort: 8765
              hostPort: 8765
          env:
            - name: AGENTIC_TOOL_ROOT
              value: /app/tool
            - name: AGENTIC_SERVE_HOST
              value: "0.0.0.0"
            - name: AGENTIC_SERVE_PORT
              value: "8765"
            - name: AGENTIC_SERVE_LOG_LEVEL
              value: info
            # Shared host metrics dir (Jetson jtop/tegrastats, CUDA nvidia-smi, AMD sysfs).
            - name: AGENTIC_JETSON_JTOP_METRICS_PATH
              value: /host/agentic-metrics/jtop-metrics.json
            - name: AGENTIC_NVIDIA_HOST_METRICS_PATH
              value: /host/agentic-metrics/nvidia-metrics.json
            - name: AGENTIC_AMD_HOST_METRICS_PATH
              value: /host/agentic-metrics/amd-metrics.json
            # Must match coordinator / warm-pool. The env Secret often sets
            # AGENTIC_RUN_STORE_PATH to the *host* path (/var/lib/agentic/run-store)
            # for jetson-sync-k8s-secret; without an explicit override + PVC mount,
            # the engine enqueues warm-pool jobs into pod-local disk and workers
            # never claim them (Comstar / Reach steps hang at step_start).
            - name: AGENTIC_EXECUTION_BACKEND
              value: kubernetes
            - name: AGENTIC_RUN_STORE_PATH
              value: /run/store
            - name: AGENTIC_K8S_NAMESPACE
              value: agentic-orchestration
            - name: AGENTIC_K8S_RUN_STORE_PVC
              value: agentic-run-store
            - name: AGENTIC_K8S_RUN_STORE_MOUNT
              value: /run/store
            # Required for AGENTIC_EXECUTION_BACKEND=kubernetes (same as coordinator).
            # jetson-enable-engine.sh rewrites the image tag from the live coordinator.
            - name: AGENTIC_K8S_ENV_SECRET
              value: agentic-orchestrator-env
            - name: AGENTIC_K8S_WORKER_IMAGE
              value: agentic-orchestrator-worker:local
            # One-writer story: this pod owns KB SQLite for Reach clients; Node web spawn
            # still writes its own emptyDir KB. Do not point Reach clients at :30487.
            - name: PYTHONUNBUFFERED
              value: "1"
            # CrewAI first-time tracing can block 20s on stdin after every crew when
            # FirstTimeTraceHandler.is_first_time sticks true. Daemon has no TTY —
            # skip prompts (see orchestration/crewai_noninteractive.py).
            - name: CREWAI_TESTING
              value: "true"
            - name: CREWAI_TRACING_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: agentic-orchestrator-env
                optional: true
          volumeMounts:
            - name: run-store
              mountPath: /run/store
            - name: tool-host
              mountPath: /app/tool
            - name: repo-version
              mountPath: /app/VERSION
              subPath: VERSION
              readOnly: true
            - name: agentic-metrics
              mountPath: /host/agentic-metrics
              readOnly: true
          readinessProbe:
            httpGet:
              # Shallow /ready (#148) — full /health probes Comfy under GPU load and
              # timed out kubelet (hybrid 6119). Do not use tcpSocket in production.
              path: /ready
              port: engine
              # Engine often serves TLS (mTLS / Reach). Kubelet skips cert verify for HTTPS probes.
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ready
              port: engine
              scheme: HTTPS
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: run-store
          persistentVolumeClaim:
            claimName: agentic-run-store
        - name: tool-host
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool
            type: Directory
        - name: repo-version
          hostPath:
            path: /var/projects/agentic-orchestration
            type: Directory
        - name: agentic-metrics
          hostPath:
            path: /var/projects/agentic-orchestration/var/agentic-metrics
            type: DirectoryOrCreate
