# Mount the full git-synced orchestration package into warm-pool workers.
# Piecemeal subPath mounts left the worker image missing modules that execute_step
# imports (e.g. deterministic_runtime) while the engine mounts the entire tool tree.
#
# jetson-sync-warm-pool.sh strips leftover jetson-orch-hostpath *file* mounts before
# applying this patch so strategic-merge does not leave conflicting subPaths.
#
# ConfigMap tool-hotfix file overlays still apply on top for paths they list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-warm-pool
  namespace: agentic-orchestration
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: jetson-orch-hostpath
              mountPath: /app/orchestration
      volumes:
        - name: jetson-orch-hostpath
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/orchestration
            type: Directory
