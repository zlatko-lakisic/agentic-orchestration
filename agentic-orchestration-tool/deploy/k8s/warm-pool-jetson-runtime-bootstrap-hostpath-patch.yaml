# Mount the full git-synced orchestration package into warm-pool workers.
# Engine already mounts the entire tool tree; piecemeal subPaths left the worker
# image missing modules execute_step imports (deterministic_runtime, …).
#
# jetson-sync-warm-pool.sh strips ConfigMap tool-hotfix *orchestration* file
# mounts before applying this — those overlays cannot bind over a directory volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-warm-pool
  namespace: agentic-orchestration
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: jetson-orch-hostpath
              mountPath: /app/orchestration
      volumes:
        - name: jetson-orch-hostpath
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/orchestration
            type: Directory
