# Ada / edge: mount host tool .venv site-packages for PYTHONPATH (image python cannot
# exec the venv interpreter — it points at host /usr/bin/python3.12).
# AGENTIC_PYTHON stays "python" (worker image) via warm-pool-fastapi-bootstrap-patch.yaml.
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: jetson-tool-venv
              mountPath: /app/tool/.venv
              readOnly: true
      volumes:
        - name: jetson-tool-venv
          hostPath:
            path: /var/projects/agentic-orchestration/agentic-orchestration-tool/.venv
            type: Directory
