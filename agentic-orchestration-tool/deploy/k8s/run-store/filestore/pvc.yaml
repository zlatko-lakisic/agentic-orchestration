# Filestore Standard tier minimum capacity is 1 TiB on GKE.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentic-run-store
  namespace: agentic-orchestration
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: agentic-filestore-rwx
  resources:
    requests:
      storage: 1Ti
