apiVersion: v1
kind: Namespace
metadata:
  name: agentic-orchestration
  labels:
    # Pod Security Admission in warn/audit mode only: surfaces pods that would not
    # pass the baseline profile without rejecting them. "enforce" is not possible
    # while the GPU workloads (ollama, comfyui) run privileged in this namespace;
    # move those to their own namespace first (see README, Hardening).
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
