# Shared fetch_url MCP gateway (supergateway + mcp_server_fetch).
# Set AGENTIC_K8S_MCP_FETCH_URL=http://agentic-mcp-fetch.agentic-orchestration.svc.cluster.local:8080/mcp
apiVersion: v1
kind: Service
metadata:
  name: agentic-mcp-fetch
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-mcp-fetch
spec:
  selector:
    app.kubernetes.io/name: agentic-mcp-fetch
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-mcp-fetch
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-mcp-fetch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-mcp-fetch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-mcp-fetch
    spec:
      # Third-party gateway image: it never talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: gateway
          # Floating tag, and `uvx mcp-server-fetch` is downloaded at pod start: pin both
          # for production (an image digest here, `uvx mcp-server-fetch==<version>` below).
          image: supercorp/supergateway:uvx
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - --stdio
            - uvx mcp-server-fetch
            - --port
            - "8080"
            - --outputTransport
            - streamableHttp
          ports:
            - containerPort: 8080
          # No envFrom: this pod fetches arbitrary URLs with third-party code and needs
          # none of the orchestrator's API keys (it used to receive the whole Secret).
          env:
            - name: AGENTIC_MCP_FETCH_ENABLED
              value: "1"
