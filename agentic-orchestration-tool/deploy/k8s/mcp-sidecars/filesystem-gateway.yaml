# filesystem_local gateway — mount workspace PVC at /workspace for the MCP server.
# Set AGENTIC_K8S_MCP_FILESYSTEM_URL=http://agentic-mcp-filesystem.agentic-orchestration.svc.cluster.local:8081/mcp
# and FILESYSTEM_MCP_ALLOWED_DIRECTORY=/workspace in the worker/coordinator env.
apiVersion: v1
kind: Service
metadata:
  name: agentic-mcp-filesystem
  namespace: agentic-orchestration
  labels:
    app.kubernetes.io/name: agentic-mcp-filesystem
spec:
  selector:
    app.kubernetes.io/name: agentic-mcp-filesystem
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-mcp-filesystem
  namespace: agentic-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-mcp-filesystem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-mcp-filesystem
    spec:
      containers:
        - name: gateway
          image: supercorp/supergateway:uvx
          args:
            - --stdio
            - npx -y @modelcontextprotocol/server-filesystem /workspace
            - --port
            - "8081"
            - --outputTransport
            - streamableHttp
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agentic-run-store
