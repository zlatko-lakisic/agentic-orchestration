[pytest]
testpaths = tests
pythonpath = .
addopts = -ra -m "not integration and not live_llm"
markers =
    unit: Pure unit tests (no network, no API keys).
    integration: Subprocess or container tests; may skip in default CI.
    live_llm: Real LLM/MCP calls; never run in CI unless explicitly enabled.
    backend_inprocess: Regression against CrewAI in-process execution (mocked kickoff).
    backend_subprocess: Subprocess execution backend (future).
    backend_kubernetes: Requires kind/cluster (future).
    timeout: Per-test timeout in seconds (pytest-timeout).
